<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Tracker — Southeast Asia & Seoul 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f4f1ec;
    --card:    #ffffff;
    --ink:     #1a1a1a;
    --mid:     #555555;
    --border:  #d8d2c8;

    --blue:    #1a5fa8;
    --blue-bg: #ddeaf8;
    --green:   #1a7a40;
    --green-bg:#d4eddf;
    --orange:  #c05a00;
    --orange-bg:#fde8d0;
    --purple:  #5a2e8a;
    --purple-bg:#ead8f8;
    --sky:     #0070b8;
    --sky-bg:  #cce8f8;

    --done-stripe: #b8b0a0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .page {
    max-width: 820px;
    margin: 0 auto;
    padding: 36px 24px 60px;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    margin-bottom: 40px;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 28px;
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.6rem;
    color: var(--ink);
    line-height: 1.2;
  }
  .header-sub {
    font-size: 1.1rem;
    color: var(--mid);
    margin-top: 8px;
    font-weight: 700;
  }

  /* ── STATS ROW ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }
  .stat-box {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px 12px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--blue);
    line-height: 1;
    display: block;
  }
  .stat-lbl {
    font-size: 0.85rem;
    color: var(--mid);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 5px;
    display: block;
  }

  /* ── PROGRESS ── */
  .progress-wrap {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 32px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .progress-label {
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .progress-pct {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--blue);
  }
  .progress-track {
    height: 22px;
    background: #e0dbd2;
    border-radius: 11px;
    overflow: visible;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 11px;
    transition: width 1.4s cubic-bezier(.16,1,.3,1);
    position: relative;
    min-width: 28px;
  }
  .progress-plane {
    position: absolute;
    right: -14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 22px;
    line-height: 1;
  }

  /* ── ROUTE STRIP ── */
  .route-wrap {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 32px;
  }
  .section-title {
    font-size: 0.85rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--mid);
    margin-bottom: 16px;
  }
  .route-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    overflow-x: auto;
    padding-bottom: 4px;
    gap: 0;
  }
  .route-stop {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .route-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #c8c0b4;
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 2px #c8c0b4;
  }
  .route-stop.done .route-dot {
    background: var(--green);
    box-shadow: 0 0 0 2px var(--green);
  }
  .route-stop.active .route-dot {
    background: var(--blue);
    box-shadow: 0 0 0 3px var(--blue);
    width: 24px; height: 24px;
  }
  .route-name {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #999;
    white-space: nowrap;
  }
  .route-stop.done .route-name  { color: var(--green); }
  .route-stop.active .route-name { color: var(--blue); font-size: 0.85rem; }
  .route-line {
    flex: 1;
    height: 4px;
    background: #d0cac0;
    min-width: 14px;
    margin-bottom: 24px;
  }
  .route-line.done { background: var(--green); }
  .route-line.inflight {
    background: linear-gradient(90deg, var(--green) 40%, #d0cac0 40%);
    position: relative;
  }

  /* ── IN-FLIGHT ARC ── */
  .inflight-wrap {
    background: #fff8e8;
    border: 3px solid #f0a800;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 32px;
  }
  .inflight-heading {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .inflight-badge {
    background: #f0a800;
    color: #1a1a1a;
    font-weight: 900;
    font-size: 0.9rem;
    padding: 5px 14px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    animation: blink 1.8s ease-in-out infinite;
  }
  .inflight-route {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--ink);
    font-weight: 700;
  }
  .arc-box {
    background: #12112a;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  #arc-svg { width:100%; height:auto; display:block; }

  /* flight stats grid */
  .fstats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }
  .fstat {
    background: #fff;
    border: 2px solid #f0d080;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .fstat-label {
    font-size: 0.8rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #7a6020;
    margin-bottom: 4px;
  }
  .fstat-value {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.2;
  }

  /* ── CALENDAR ── */
  .cal-wrap {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }
  .cal-month {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-dow {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--mid);
    padding-bottom: 8px;
  }
  .cal-day {
    border-radius: 10px;
    border: 2px solid transparent;
    padding: 8px 4px 6px;
    text-align: center;
    min-height: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: default;
    transition: transform .15s;
  }
  .cal-day:hover { transform: scale(1.04); z-index: 2; position: relative; }
  .cal-day.empty { min-height: 0; border: none; }
  .cal-day.outside { opacity: .3; }

  /* country colours — solid backgrounds, dark text */
  .cal-day.ireland  { background: var(--sky-bg);    border-color: var(--sky); }
  .cal-day.thailand { background: var(--orange-bg); border-color: var(--orange); }
  .cal-day.vietnam  { background: var(--green-bg);  border-color: var(--green); }
  .cal-day.korea    { background: var(--purple-bg); border-color: var(--purple); }
  .cal-day.flight   { background: #fff5cc;          border-color: #d4a000; }

  /* past days desaturated */
  .cal-day.past { opacity: .55; }

  /* today ring */
  .cal-day.today {
    box-shadow: 0 0 0 3px var(--blue);
    border-color: var(--blue) !important;
    opacity: 1 !important;
  }

  .cal-num {
    font-size: 1.05rem;
    font-weight: 900;
    color: var(--ink);
    line-height: 1;
  }
  .cal-icon { font-size: 1.2rem; line-height: 1; }
  .cal-city {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink);
    line-height: 1;
  }
  .cal-day.flight .cal-num { color: #7a4e00; }

  /* ── LEGEND ── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 2px solid var(--border);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--ink);
  }
  .legend-swatch {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid rgba(0,0,0,.2);
    flex-shrink: 0;
  }

  /* ── FOOTER ── */
  .last-updated {
    text-align: center;
    font-size: 0.85rem;
    color: var(--mid);
    margin-top: 28px;
    font-weight: 700;
  }

  /* ── ON LAND ── */
  .onland-wrap {
    background: var(--card);
    border: 3px solid var(--green);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 32px;
    animation: fadeIn .5s .25s ease both;
  }
  .onland-heading {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .onland-badge {
    background: var(--green);
    color: #fff;
    font-weight: 900;
    font-size: 0.95rem;
    padding: 5px 14px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .onland-city {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--ink);
    font-weight: 700;
  }

  /* ── ANIMATIONS ── */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.5} }
  @keyframes planeFly { 0%,100%{opacity:.6;transform:translateY(0)} 50%{opacity:1;transform:translateY(-3px)} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

  .stats       { animation: fadeIn .5s ease both; }
  .progress-wrap { animation: fadeIn .5s .1s ease both; }
  .route-wrap  { animation: fadeIn .5s .2s ease both; }
  .inflight-wrap { animation: fadeIn .5s .25s ease both; }
  .cal-wrap    { animation: fadeIn .5s .3s ease both; }

  @media(max-width:560px){
    /* Page */
    .page { padding: 20px 12px 50px; }

    /* Header */
    .header { margin-bottom: 24px; padding-bottom: 20px; }
    .header h1 { font-size: 1.6rem; }
    .header-sub { font-size: .9rem; }

    /* Stats */
    .stats { grid-template-columns: repeat(2,1fr); gap:10px; margin-bottom:20px; }
    .stat-num { font-size: 1.8rem; }
    .stat-box { padding: 12px 8px; }
    .stat-lbl { font-size: .72rem; }

    /* Progress */
    .progress-wrap { padding: 14px 16px; margin-bottom:20px; }
    .progress-track { height: 18px; }

    /* Route strip */
    .route-wrap { padding: 14px 12px; margin-bottom:20px; }
    .route-row { gap: 0; }
    .route-name { font-size: .62rem; }
    .route-line { min-width: 8px; max-width: 24px; }

    /* In-flight / on-land panels */
    .inflight-wrap { padding: 16px 14px; margin-bottom:20px; }
    .inflight-heading { gap: 8px; margin-bottom:12px; }
    .inflight-route { font-size: 1.2rem; }
    .inflight-badge { font-size: .78rem; padding: 4px 10px; }
    .fstats { grid-template-columns: 1fr 1fr; gap: 8px; }
    .fstat { padding: 10px 12px; }
    .fstat-label { font-size: .72rem; }
    .fstat-value { font-size: 1rem; }

    .onland-wrap { padding: 16px 14px; margin-bottom:20px; }
    .onland-city { font-size: 1.2rem; }
    #onland-map { height: 220px; }

    /* Calendar */
    .cal-wrap { padding: 16px 10px; }
    .cal-month { font-size: 1.3rem; margin-bottom:12px; }
    .cal-grid { gap: 3px; }
    .cal-dow { font-size: .65rem; padding-bottom: 6px; }
    .cal-day { min-height: 52px; padding: 5px 2px 4px; border-radius: 7px; border-width: 1.5px; }
    .cal-num { font-size: .9rem; }
    .cal-icon { font-size: 1rem; }
    .cal-city { font-size: .52rem; letter-spacing: 0; }

    /* Legend */
    .legend { gap: 8px 14px; margin-top: 14px; }
    .legend-item { font-size: .8rem; }
    .legend-swatch { width: 16px; height: 16px; }

    /* Footer */
    .last-updated { font-size: .75rem; }
  }

  /* Popup — full-screen on mobile */
  @media(max-width:500px){
    #cal-overlay { padding: 0; align-items: flex-end; }
    #cal-overlay > div {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px 18px 32px;
    }
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <header class="header">
    <h1>✈ Southeast Asia &amp; Seoul 2026</h1>
    <div class="header-sub">June 5 – June 30 &nbsp;·&nbsp; 25 Nights &nbsp;·&nbsp; 7 Destinations</div>
    <div style="margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:#d4eddf;border:2px solid #1a7a40;border-radius:20px;padding:5px 14px;">
      <span style="width:9px;height:9px;background:#1a7a40;border-radius:50%;display:inline-block;animation:blink 1.4s ease-in-out infinite;flex-shrink:0;"></span>
      <span style="font-size:.95rem;font-weight:900;color:#1a7a40;letter-spacing:.06em;">Live</span>
      <span id="live-clock" style="font-size:.85rem;font-weight:700;color:#1a5fa8;"></span>
    </div>
  </header>

  <!-- STATS -->
  <div class="stats">
    <div class="stat-box">
      <span class="stat-num" id="stat-days">0</span>
      <span class="stat-lbl">Days Travelled</span>
    </div>
    <div class="stat-box">
      <span class="stat-num" id="stat-nights">0</span>
      <span class="stat-lbl">Nights Done</span>
    </div>
    <div class="stat-box">
      <span class="stat-num">25</span>
      <span class="stat-lbl">Total Nights</span>
    </div>
    <div class="stat-box">
      <span class="stat-num">7</span>
      <span class="stat-lbl">Destinations</span>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-label">Trip Progress</span>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%">
        <span class="progress-plane">✈</span>
      </div>
    </div>
  </div>

  <!-- ROUTE STRIP -->
  <div class="route-wrap">
    <div class="section-title">Route</div>
    <div class="route-row" id="route-row"></div>
  </div>

  <!-- IN-FLIGHT (hidden by default) -->
  <div class="inflight-wrap" id="inflight-wrap" style="display:none">
    <div class="inflight-heading">
      <span class="inflight-badge">✈ In the Air Right Now</span>
      <span class="inflight-route" id="inflight-route"></span>
    </div>
    <div class="arc-box">
      <svg id="arc-svg" viewBox="0 0 600 190" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="doneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f0a800" stop-opacity=".5"/>
            <stop offset="100%" stop-color="#ffe066" stop-opacity="1"/>
          </linearGradient>
          <filter id="glow2">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a0f2e"/>
            <stop offset="100%" stop-color="#0e1a40"/>
          </linearGradient>
        </defs>
        <rect width="600" height="190" fill="url(#skyG)"/>
        <circle cx="80"  cy="30" r="1.2" fill="rgba(255,255,255,.7)"/>
        <circle cx="150" cy="18" r="1"   fill="rgba(255,255,255,.5)"/>
        <circle cx="230" cy="35" r="1.5" fill="rgba(255,255,255,.6)"/>
        <circle cx="320" cy="12" r="1"   fill="rgba(255,255,255,.4)"/>
        <circle cx="410" cy="28" r="1.2" fill="rgba(255,255,255,.7)"/>
        <circle cx="490" cy="15" r="1"   fill="rgba(255,255,255,.5)"/>
        <circle cx="560" cy="40" r="1.3" fill="rgba(255,255,255,.6)"/>
        <circle cx="180" cy="55" r=".8"  fill="rgba(255,255,255,.4)"/>
        <circle cx="380" cy="50" r=".9"  fill="rgba(255,255,255,.4)"/>
        <ellipse cx="90"  cy="155" rx="55" ry="14" fill="rgba(255,255,255,.05)"/>
        <ellipse cx="300" cy="165" rx="70" ry="14" fill="rgba(255,255,255,.04)"/>
        <ellipse cx="510" cy="158" rx="60" ry="14" fill="rgba(255,255,255,.05)"/>
        <path id="full-arc" d="" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1.5" stroke-dasharray="6,5"/>
        <path id="done-arc" d="" fill="none" stroke="url(#doneGrad)" stroke-width="3" filter="url(#glow2)"/>
        <circle id="dep-dot" cx="60" cy="155" r="6" fill="#ffe066"/>
        <text id="dep-lbl" x="60" y="176" text-anchor="middle" fill="#ffe066" font-size="12" font-family="Lato,sans-serif" font-weight="700"></text>
        <circle id="arr-dot" cx="540" cy="155" r="6" fill="rgba(255,255,255,.4)"/>
        <text id="arr-lbl" x="540" y="176" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="12" font-family="Lato,sans-serif" font-weight="700"></text>
        <g id="plane-g" filter="url(#glow2)">
          <circle cx="0" cy="0" r="13" fill="rgba(255,224,102,.2)"/>
          <text x="0" y="7" text-anchor="middle" font-size="20" fill="#ffe066" style="animation:planeFly 2s ease-in-out infinite">✈</text>
        </g>
      </svg>
    </div>
    <div class="fstats" id="fstats"></div>
  </div>

  <!-- ON LAND (shown when not in flight) -->
  <div class="onland-wrap" id="onland-wrap" style="display:none">
    <div class="onland-heading">
      <span class="onland-badge" id="onland-badge">📍 On the Ground</span>
      <span class="onland-city" id="onland-city"></span>
    </div>
    <div id="onland-map" style="width:100%;height:280px;border-radius:10px;border:2px solid var(--border);"></div>
  </div>

  <!-- CALENDAR -->
  <div class="cal-wrap">
    <div class="cal-month">June 2026</div>
    <div class="cal-grid" id="cal-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="last-updated" id="last-updated"></div>
</div>

<script>
// ── DATA ──
// Flight numbers researched from booking URLs and schedule databases:
// Dublin→Bangkok: Etihad EY46 (DUB→AUH) + EY408 (AUH→BKK) — confirmed from Etihad booking link
// Bangkok→Chiang Mai: Thai AirAsia FD1669 — confirmed by base64 decode of AirAsia booking URL
// Chiang Mai→Phuket: Thai AirAsia FD3160 — 11:25 departure matches spreadsheet (schedules show 11:25→13:25)
// Phuket→Ho Chi Minh: VietJet VJ808 — only direct daily service on this route (dep 11:55 rescheduled to 09:00 in Jun)
// Ho Chi Minh→Da Nang: VietJet VJ630 — confirmed daily SGN→DAD service matching 10:00 departure
// Da Nang→Seoul: Jeju Air 7C2218 — confirmed DAD→ICN morning departure, 5hr flight matches 09:00→16:00
const flights = [
  { from:"Dublin", to:"Bangkok", dep:"2026-06-05T08:00", arr:"2026-06-06T06:00",
    legs:[
      { airline:"Etihad Airways", flightNo:"EY 46",  from:"Dublin",    to:"Abu Dhabi", dep:"2026-06-05T08:00", arr:"2026-06-05T17:35", fr24:"EY46"  },
      { airline:"Etihad Airways", flightNo:"EY 408", from:"Abu Dhabi", to:"Bangkok",   dep:"2026-06-05T20:35", arr:"2026-06-06T06:30", fr24:"EY408" },

// ── LIVE TICK — runs every 30 seconds ──
const tripStart = new Date("2026-06-05T00:00");
const tripEnd   = new Date("2026-06-30T23:59");

function tick() {
  const now = new Date();
  // const now = new Date("2026-06-10T09:30"); // ← uncomment to test in-flight

  const tripDay = Math.min(Math.max(Math.floor((now-tripStart)/86400000),0),25);
  const pct     = Math.min(Math.round((now-tripStart)/(tripEnd-tripStart)*100),100);

  // active flight
  let af = null;
  for(const f of flights){ if(now>=new Date(f.dep)&&now<new Date(f.arr)){af=f;break;} }

  // stay statuses
  stays.forEach(s=>{
    const st=new Date(2026,5,s.start), en=new Date(2026,5,s.end,23,59);
    if(af){ s.status=now>en?"done":"upcoming"; if(s.city===af.from)s.status="done"; }
    else{ s.status=now<st?"upcoming":now<=en?"active":"done"; }
  });
  const nightsDone=stays.filter(s=>s.status==="done").reduce((a,s)=>a+s.nights,0);

  // stats
  document.getElementById("progress-fill").style.width=pct+"%";
  document.getElementById("progress-pct").textContent=pct+"%";
  document.getElementById("stat-days").textContent=tripDay;
  document.getElementById("stat-nights").textContent=nightsDone;

  // live clock badge
  const liveEl = document.getElementById("live-clock");
  if(liveEl) liveEl.textContent = "Live · " + now.toLocaleTimeString("en-IE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});

  // route strip — rebuild each tick so status dots update
  const routeRow=document.getElementById("route-row");
  routeRow.innerHTML="";
  stays.forEach((s,i)=>{
    const dotSt=af?(s.city===af.from?"done":s.status):s.status;
    const stop=document.createElement("div");
    stop.className=`route-stop ${dotSt}`;
    stop.innerHTML=`<div class="route-dot"></div><div class="route-name">${s.city}</div>`;
    routeRow.appendChild(stop);
    if(i<stays.length-1){
      const ln=document.createElement("div");
      const lnDone=s.status==="done";
      ln.className="route-line"+(lnDone?" done":"");
      if(af&&s.city===af.from){
        ln.className="route-line inflight";
        ln.innerHTML=`<span style="position:relative;display:flex;justify-content:center;top:-14px;font-size:20px;animation:planeFly 1.8s ease-in-out infinite">✈</span>`;
      }
      routeRow.appendChild(ln);
    }
  });

  // in-flight arc
  const inflightWrap = document.getElementById("inflight-wrap");
  if(af){
    inflightWrap.style.display="block";

    // For connecting flights, figure out which leg we're currently on
    let activeLeg = null;
    if(af.legs) {
      for(const leg of af.legs) {
        const legDep = new Date(leg.dep), legArr = new Date(leg.arr);
        if(now >= legDep && now < legArr) { activeLeg = leg; break; }
      }
      // Between legs (on ground at stopover) — show layover state
      if(!activeLeg) {
        const leg1Arr = new Date(af.legs[0].arr);
        const leg2Dep = new Date(af.legs[1].dep);
        if(now >= leg1Arr && now < leg2Dep) {
          activeLeg = { isLayover: true, at:"Abu Dhabi", nextDep: leg2Dep, nextFlight: af.legs[1].flightNo };
        }
      }
    }

    const localTime=(date,city)=>date.toLocaleString('en-US',{timeZone:cityTZ[city]||"UTC",hour:'numeric',minute:'2-digit',hour12:true});

    if(activeLeg && activeLeg.isLayover) {
      // Layover at Abu Dhabi
      const waitMin = Math.max(0, Math.round((activeLeg.nextDep - now)/60000));
      const wh = Math.floor(waitMin/60), wm = waitMin%60;
      document.getElementById("inflight-route").innerHTML =
        `Dublin → Bangkok<br>
         <span style="font-family:Lato,sans-serif;font-size:1rem;font-weight:900;color:#c05a00;background:#fde8d0;padding:4px 12px;border-radius:6px;">🛬 Stopover — Abu Dhabi · ${wh}h ${wm}m until ${activeLeg.nextFlight}</span>`;
      // Show arc as complete leg 1
      const x1=60,y1=155,x2=540,y2=155,cpX=300,cpY=40;
      document.getElementById("full-arc").setAttribute("d",`M ${x1} ${y1} Q ${cpX} ${cpY} ${x2} ${y2}`);
      document.getElementById("done-arc").setAttribute("d",`M ${x1} ${y1} Q ${cpX} ${cpY} ${x2} ${y2}`);
      document.getElementById("plane-g").setAttribute("transform",`translate(${x2},${y2})`);
      document.getElementById("dep-lbl").textContent="Dublin";
      document.getElementById("arr-lbl").textContent="Abu Dhabi";
      document.getElementById("fstats").innerHTML=`
        <div class="fstat"><div class="fstat-label">Landed at</div><div class="fstat-value">Abu Dhabi (AUH)</div></div>
        <div class="fstat"><div class="fstat-label">Next Flight</div><div class="fstat-value">EY 408 to Bangkok</div></div>
        <div class="fstat"><div class="fstat-label">Departs in</div><div class="fstat-value">${wh}h ${wm}m</div></div>`;

    } else {
      // Active leg or single flight
      const legData = activeLeg || af;
      const depCity = legData.from || af.from;
      const arrCity = legData.to   || af.to;
      const dep = new Date(legData.dep), arr = new Date(legData.arr);
      const prog = Math.max(0, Math.min(1, (now-dep)/(arr-dep)));

      // Airline & flight number badge
      const airline   = activeLeg ? activeLeg.airline   : af.airline;
      const flightNo  = activeLeg ? activeLeg.flightNo  : af.flightNo;
      const fr24      = activeLeg ? activeLeg.fr24      : af.fr24;
      const legLabel  = af.legs
        ? `Leg ${af.legs.indexOf(activeLeg)+1} of 2 · Dublin → Bangkok`
        : "";

      document.getElementById("inflight-route").innerHTML =
        `${depCity} → ${arrCity}
         ${legLabel ? `<span style="font-size:.85rem;color:#888;display:block;margin-top:2px;">${legLabel}</span>` : ""}
         <span style="font-family:Lato,sans-serif;font-size:1rem;font-weight:900;color:#1a5fa8;background:#ddeaf8;padding:4px 12px;border-radius:6px;letter-spacing:.05em;display:inline-block;margin-top:4px;">${airline} &nbsp;·&nbsp; Flight ${flightNo}</span>`;

      // SVG arc
      const x1=60,y1=155,x2=540,y2=155,cpX=300,cpY=40;
      document.getElementById("full-arc").setAttribute("d",`M ${x1} ${y1} Q ${cpX} ${cpY} ${x2} ${y2}`);
      const t=prog;
      const px=(1-t)*(1-t)*x1+2*(1-t)*t*cpX+t*t*x2;
      const py=(1-t)*(1-t)*y1+2*(1-t)*t*cpY+t*t*y2;
      const dx=2*(1-t)*(cpX-x1)+2*t*(x2-cpX);
      const dy=2*(1-t)*(cpY-y1)+2*t*(y2-cpY);
      let dp=`M ${x1} ${y1}`;
      for(let i=1;i<=Math.round(t*50);i++){const ti=i/50;dp+=` L ${(1-ti)*(1-ti)*x1+2*(1-ti)*ti*cpX+ti*ti*x2} ${(1-ti)*(1-ti)*y1+2*(1-ti)*ti*cpY+ti*ti*y2}`;}
      document.getElementById("done-arc").setAttribute("d",dp);
      document.getElementById("plane-g").setAttribute("transform",`translate(${px},${py}) rotate(${Math.atan2(dy,dx)*180/Math.PI})`);
      document.getElementById("dep-lbl").textContent=depCity;
      document.getElementById("arr-lbl").textContent=arrCity;

      const totalMin=Math.round((arr-dep)/60000);
      const leftSec=Math.max(0,Math.round((arr-now)/1000));
      const h=Math.floor(leftSec/3600), m=Math.floor((leftSec%3600)/60), s=leftSec%60;
      const timeLeft = h>0?`${h} hr ${m} min`:m>0?`${m} min ${s} sec`:`${s} sec`;
      const dur=`${Math.floor(totalMin/60)} hr ${totalMin%60} min`;
      const fr24Link = fr24
        ? `<a href="https://www.flightradar24.com/${fr24.toLowerCase()}" target="_blank"
             style="display:inline-block;background:#ff6600;color:#fff;font-size:.8rem;font-weight:900;padding:5px 12px;border-radius:8px;text-decoration:none;margin-top:4px;">
             Track on Flightradar24 ↗</a>` : "";

      document.getElementById("fstats").innerHTML=`
        <div class="fstat">
          <div class="fstat-label">Departed (${depCity} local)</div>
          <div class="fstat-value">${localTime(dep,depCity)}</div>
        </div>
        <div class="fstat">
          <div class="fstat-label">Arrives (${arrCity} local)</div>
          <div class="fstat-value">${localTime(arr,arrCity)}</div>
        </div>
        <div class="fstat">
          <div class="fstat-label">Total Flight Time</div>
          <div class="fstat-value">${dur}</div>
        </div>
        <div class="fstat">
          <div class="fstat-label">Time Remaining</div>
          <div class="fstat-value">${timeLeft}</div>
        </div>
        <div class="fstat">
          <div class="fstat-label">Journey Complete</div>
          <div class="fstat-value">${Math.round(prog*100)}%</div>
        </div>
        ${fr24Link ? `<div style="grid-column:1/-1;text-align:center;">${fr24Link}</div>` : ""}`;
    }

  } else {
    inflightWrap.style.display="none";
    const onlandWrap = document.getElementById("onland-wrap");

    // Find current city
    const currentStay = stays.find(s => s.status === "active");
    if(currentStay && onlandWrap) {
      onlandWrap.style.display="block";
      const coords = cityCoords[currentStay.city];
      document.getElementById("onland-badge").textContent = "📍 On the Ground Now";
      document.getElementById("onland-city").textContent = currentStay.flag + "  " + currentStay.city + ", " + currentStay.country;

      // Only render map once (check for leaflet id)
      const mapEl = document.getElementById("onland-map");
      if(mapEl && !mapEl._leaflet_id) {
        const doRender = () => renderStayMap("onland-map", coords.lat, coords.lon, coords.zoom, currentStay.city);
        if(!window.L) loadLeaflet(doRender);
        else doRender();
      }
    } else if(onlandWrap) {
      onlandWrap.style.display="none";
    }
  }
}

          <table style="width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px;">
            <tr><td style="padding:3px 0;color:#555;font-weight:700;">Departs</td><td style="padding:3px 0;font-weight:900;text-align:right;">${localTime(legDep,leg.from)} (${leg.from})</td></tr>
            <tr style="border-top:1px solid rgba(0,0,0,.08)"><td style="padding:3px 0;color:#555;font-weight:700;">Arrives</td><td style="padding:3px 0;font-weight:900;text-align:right;">${localTime(legArr,leg.to)} (${leg.to})</td></tr>
            <tr style="border-top:1px solid rgba(0,0,0,.08)"><td style="padding:3px 0;color:#555;font-weight:700;">Duration</td><td style="padding:3px 0;font-weight:900;text-align:right;">${legDur}</td></tr>
          </table>
        </div>`;
      });
      legsHtml += `<div style="font-size:.85rem;color:#555;font-weight:700;margin-bottom:12px;">Total journey: <strong>${totalDur}</strong> including stopover in Abu Dhabi</div>`;
    } else {
      // Single leg
      legsHtml = `
        <div style="background:#ddeaf8;border:2px solid #1a5fa8;border-radius:10px;padding:14px 16px;margin:12px 0;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
            <div>
              <div style="font-size:1.1rem;font-weight:900;color:#1a5fa8;">${f.airline}</div>
              <div style="font-size:1.5rem;font-weight:900;color:#1a1a1a;letter-spacing:.04em;">Flight ${f.flightNo}</div>
              ${f.note?`<div style="font-size:.85rem;color:#555;margin-top:3px;">${f.note}</div>`:""}
            </div>
            <a href="https://www.flightradar24.com/${f.fr24.toLowerCase()}" target="_blank"
               style="background:#ff6600;color:#fff;font-size:.8rem;font-weight:900;padding:6px 12px;border-radius:8px;text-decoration:none;white-space:nowrap;align-self:flex-start;">
              Track Live on<br>Flightradar24 ↗
            </a>
          </div>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:.95rem;margin-bottom:14px;">
          <tr><td style="padding:6px 0;color:#555;font-weight:700;">Departs</td><td style="padding:6px 0;font-weight:900;text-align:right;">${localTime(dep,f.from)} <span style="font-size:.8em;color:#777;">(${f.from})</span></td></tr>
          <tr style="border-top:1px solid #eee"><td style="padding:6px 0;color:#555;font-weight:700;">Arrives</td><td style="padding:6px 0;font-weight:900;text-align:right;">${localTime(arr,f.to)} <span style="font-size:.8em;color:#777;">(${f.to})</span></td></tr>
          <tr style="border-top:1px solid #eee"><td style="padding:6px 0;color:#555;font-weight:700;">Flight Time</td><td style="padding:6px 0;font-weight:900;text-align:right;">${totalDur}</td></tr>
        </table>`;
    }

    body = `
      <div style="font-size:1.6rem;font-weight:900;color:#1a1a1a;margin-bottom:10px;">✈️ ${f.from} → ${f.to}</div>
      ${legsHtml}
      <div style="font-size:.8rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;">Flight Route</div>
      <div id="${mapId}" style="width:100%;height:200px;border-radius:10px;border:2px solid #d8d2c8;"></div>`;

    setTimeout(()=>{
      if(!window.L){ loadLeaflet(()=>renderFlightMap(mapId, c1, c2)); }
      else { renderFlightMap(mapId, c1, c2); }
    }, 50);

  } else {
    // stay / rest day — show city map
    const stayData = stays.find(s=>s.city===rich.city);
    const coords = cityCoords[rich.city];
    const lat = coords ? coords.lat : 20;
    const lon = coords ? coords.lon : 100;
    const zoom = coords ? coords.zoom : 11;
    const mapId2 = "map-stay-"+day;
    const mapUrl2 = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=${zoom}/${lat}/${lon}`;

    body = `
      <div style="font-size:2.2rem;margin-bottom:4px;">${rich.flag}</div>
      <div style="font-size:1.7rem;font-weight:900;color:#1a1a1a;margin-bottom:2px;">${rich.city}</div>
      <div style="font-size:1rem;color:#555;font-weight:700;margin-bottom:12px;">${rich.country}</div>
      <div style="background:#f4f1ec;border-radius:10px;padding:12px 16px;font-size:1rem;color:#333;border:2px solid #d8d2c8;margin-bottom:14px;">
        <strong>😴 Rest Day</strong> — relaxing in ${rich.city}
        ${stayData && stayData.nights > 0 ? `<div style="margin-top:4px;color:#666;font-size:.9rem;">${stayData.nights} nights total here</div>` : ""}
      </div>
      <div style="font-size:.8rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;">📍 Where in the world</div>
      <div id="${mapId2}" style="width:100%;height:220px;border-radius:10px;border:2px solid #d8d2c8;"></div>
      <div style="text-align:center;margin-top:6px;">
        <a href="${mapUrl2}" target="_blank" style="font-size:.8rem;color:#1a5fa8;">Open full map ↗</a>
      </div>`;

    setTimeout(()=>{
      if(!window.L){ loadLeaflet(()=>renderStayMap(mapId2, lat, lon, zoom, rich.city)); }
      else { renderStayMap(mapId2, lat, lon, zoom, rich.city); }
    }, 50);
  }

  popup.innerHTML = `
    <button onclick="document.getElementById('cal-overlay').style.display='none'" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.8rem;cursor:pointer;color:#555;line-height:1;">×</button>
    <div style="font-size:.82rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;padding-right:28px;">${dayLabel}${todayBadge}${pastTag}</div>
    ${body}
  `;
  overlay.style.display="flex";
}



// Pre-load Leaflet so first popup is instant
loadLeaflet(()=>{});

function renderStayMap(id, lat, lon, zoom, cityName) {
  try {
    const el = document.getElementById(id);
    if(!el || el._leaflet_id) return;
    const map = L.map(id, { zoomControl:true, scrollWheelZoom:false }).setView([lat,lon], zoom);
    L.tileLayer(TILE, { attribution:ATTR, subdomains:"abcd", maxZoom:19 }).addTo(map);
    L.marker([lat,lon]).addTo(map).bindPopup(`<b>${cityName}</b>`).openPopup();
  } catch(e) {
    const el = document.getElementById(id);
    if(el) el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:.9rem;font-weight:700;">📍 ${cityName}<br><small>Map unavailable offline</small></div>`;
  }
}

function renderFlightMap(id, c1, c2) {
  try {
    const el = document.getElementById(id);
    if(!el || el._leaflet_id) return;
    const midLat=(c1.lat+c2.lat)/2, midLon=(c1.lon+c2.lon)/2;
    const latDiff=Math.abs(c1.lat-c2.lat), lonDiff=Math.abs(c1.lon-c2.lon);
    const span=Math.max(latDiff,lonDiff);
    const zoom = span>40?3:span>20?4:span>10?5:6;
    const map = L.map(id, { zoomControl:true, scrollWheelZoom:false }).setView([midLat,midLon], zoom);
    L.tileLayer(TILE, { attribution:ATTR, subdomains:"abcd", maxZoom:19 }).addTo(map);
    const greenIcon = L.divIcon({html:'<div style="background:#1a7a40;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>', iconSize:[12,12], className:""});
    const blueIcon  = L.divIcon({html:'<div style="background:#1a5fa8;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>', iconSize:[12,12], className:""});
    L.marker([c1.lat,c1.lon],{icon:greenIcon}).addTo(map).bindPopup(`<b>Departs: ${Object.keys(cityCoords).find(k=>cityCoords[k]===c1)}</b>`);
    L.marker([c2.lat,c2.lon],{icon:blueIcon}).addTo(map).bindPopup(`<b>Arrives: ${Object.keys(cityCoords).find(k=>cityCoords[k]===c2)}</b>`);
    L.polyline([[c1.lat,c1.lon],[c2.lat,c2.lon]], {color:"#1a5fa8", weight:2, dashArray:"6,4", opacity:0.7}).addTo(map);
  } catch(e) {
    const el = document.getElementById(id);
    if(el) el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:.9rem;font-weight:700;">Map unavailable offline</div>`;
  }
}

// Pre-load Leaflet so first popup is instant
loadLeaflet(()=>{});


const legendDefs=[
  {label:"Ireland",    bg:"var(--sky-bg)",    border:"var(--sky)"},
  {label:"Thailand",   bg:"var(--orange-bg)", border:"var(--orange)"},
  {label:"Vietnam",    bg:"var(--green-bg)",  border:"var(--green)"},
  {label:"South Korea",bg:"var(--purple-bg)", border:"var(--purple)"},
  {label:"Flight day", bg:"#fff5cc",          border:"#d4a000"},
];
const leg=document.getElementById("legend");
legendDefs.forEach(l=>{
  leg.innerHTML+=`<div class="legend-item">
    <div class="legend-swatch" style="background:${l.bg};border-color:${l.border}"></div>
    <span>${l.label}</span></div>`;
});

// 1-second clock
function clockTick(){
  const liveEl=document.getElementById("live-clock");
  if(liveEl) liveEl.textContent=new Date().toLocaleTimeString("en-IE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const ftEl=document.getElementById("last-updated");
  if(ftEl) ftEl.textContent="Page auto-updates every 30 sec · Current time: "+new Date().toLocaleTimeString("en-IE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
clockTick();
setInterval(clockTick,1000);
</script>
